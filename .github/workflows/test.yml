name: ci
on:
  push: 
    branches: [main, development, v1*]
  pull_request:
    branches: [main, development, v1*]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: bundle exec jekyll build
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js assets/js/explore/*.js assets/js/explore/modules/*.js assets/js/explore/components/*.js netlify/functions/*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
      - name: Check Explore calculations and exports
        run: |
          node scripts/validation/check_explore_search.cjs
          node scripts/validation/check_explore_map_export.cjs
          node scripts/validation/check_codicology_research.cjs
      - name: Check Explore card markup
        run: bundle exec rake site:check_explore_cards
