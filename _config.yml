# ==============================================================
# SITE CONFIGURATION
# ==============================================================
# Jekyll configuration files are written in YAML format.
# Colons, tabs/spacing, and quotes are meaningful in YAML.
# It is recommended you look at the following guide to avoid
# syntax errors in this file:
# ~> https://learnxinyminutes.com/docs/yaml/
#
#
# Questions ?
#
# ---------------------------------------------------------------
# MAIN SETTINGS
# ---------------------------------------------------------------
# Feel free to change these! For more info, refer to:
# ~> https://jekyllrb.com/docs/configuration/options/

title:            'Unknown Hands'
description:      'Female Scribes in Pre-Modern Europe'
url:              'https://estellegueville.com'
baseurl:          '/unknownhands'
copyright:        'Estelle Guéville, 2025'
logo:             '/assets/img/sticker.webp'
default_thumb:    '/assets/img/sticker.webp'

# ---------------------------------------------------------------
# BUILD SETTINGS
# ---------------------------------------------------------------
# Best not to mess with these unless you know what you're doing!

permalink: 'pretty'
sass:
  style: compressed
exclude: ["Gemfile*", "*.gemspec", "Rakefile", "vendor", "spec", "README.md", "LICENSE.txt", "Docker*", "scripts", "exports", ".venv", "data/annos", "assets/search/transcriptions.json"]
webrick:
  headers:
    'Access-Control-Allow-Origin': '*'
kramdown:
 auto_ids:       true
 footnote_nr:    1
 entity_output:  as_char
 footnote_backlink: "&#x21a9;&#xfe0e;"
 toc_levels:     1..6
 smart_quotes:   lsquo,rsquo,ldquo,rdquo
 enable_coderay: false


# --------------------------------------------------------------
# COLLECTION SETTINGS
# --------------------------------------------------------------
# Unknown Hands uses Jekyll collections for structured content.
# For more info, refer to:
# ~> https://jekyllrb.com/docs/collections/

collections:
  exhibits:
    output: true
  scribes:
    output: true
    layout: 'scribe_profile'
  unknownhands: # name of collection
    output: true # makes sure pages are output as html files
    layout: 'scribe_item' # the layout for the pages to use
    metadata:
      source: 'unknownhands.csv' # path to the metadata file within `_data`
    images:
      source: 'raw_images/unknownhands' # path to the directory of images within `_data`

# --------------------------------------------------------------
# SEARCH INDEX SETTINGS
# --------------------------------------------------------------
# You can create multiple search indexes below (though only one is
# recommended!) by specifying
# an `index` file to write it to and some `collections` for it to index
# and running the relevant search-index generation task.

search:
  main:
    index: '/search/index.json' # file the index will get written to
    collections:
      unknownhands:
        content: false # whether or not to index page content
        fields: # the metadata fields to index
          - call_number
          - label
          - folio

# --------------------------------------------------------------
